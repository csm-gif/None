<!doctype html>
<html lang="en" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <meta name="description" content="{{DESCRIPTION}}">
  <meta name="robots" content="{{ROBOTS}}">
  <link rel="canonical" href="{{URL}}">
  <meta name="theme-color" content="#0D1B2A">
  <meta name="color-scheme" content="light">
  <script>document.documentElement.className="js";</script>
  <link rel="preload" href="/assets/fonts/ibm-plex-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta property="og:type" content="{{OG_TYPE}}">
  <meta property="og:site_name" content="{{SITE_NAME}}">
  <meta property="og:title" content="{{TITLE}}">
  <meta property="og:description" content="{{DESCRIPTION}}">
  <meta property="og:url" content="{{URL}}">
  <meta property="og:image" content="{{SITE_URL}}/assets/img/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Digi World: know what's working, fix what isn't.">
  <meta property="og:locale" content="en">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{TITLE}}">
  <meta name="twitter:description" content="{{DESCRIPTION}}">
  <meta name="twitter:image" content="{{SITE_URL}}/assets/img/og-image.png">
  <!-- International: if you add translations later, add <link rel="alternate" hreflang="..."> tags here (see README). -->
  <style>{{CSS}}</style>
  <script src="/assets/js/main.js?v={{JS_VERSION}}" defer></script>
  <script type="application/ld+json">{{JSONLD}}</script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  {{SPRITE}}
  {{HEADER}}
  <main id="main" tabindex="-1">
{{CONTENT}}
  </main>
  {{FOOTER}}
  {{CONSENT}}
</body>
</html>
